<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة تحكم عالمي</title>
<link rel="icon" href="alami-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c; --panel:#141416; --panel2:#1b1b1f; --line:#2a2a30;
    --gold:#d4af37; --gold2:#f1d27a; --text:#f2f2f2; --muted:#9a9aa3;
    --ok:#2fbf71; --bad:#e5484d; --warn:#f5a524; --info:#4ea1ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px}
  a{color:var(--gold2)}
  button{font-family:inherit;font-size:14px;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 14px}
  button:hover{border-color:var(--gold)}
  button:disabled{opacity:.5;cursor:wait}
  .btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#111;border:none;font-weight:600}
  .btn-ok{background:rgba(47,191,113,.15);border-color:rgba(47,191,113,.5);color:#7ee2a8}
  .btn-bad{background:rgba(229,72,77,.12);border-color:rgba(229,72,77,.5);color:#ff9a9d}
  .btn-sm{padding:5px 10px;font-size:13px}
  input,select,textarea{font-family:inherit;font-size:14px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}

  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:40px 32px;max-width:380px;width:100%;text-align:center}
  .login-card img{width:84px;height:84px;border-radius:20px;margin-bottom:12px}
  .login-card h1{margin:0 0 6px;font-size:22px;color:var(--gold2)}
  .login-card p{color:var(--muted);margin:0 0 24px;line-height:1.7}
  .err{color:#ff9a9d;margin-top:14px;line-height:1.7}

  /* layout */
  #app{display:none;min-height:100vh}
  .side{position:fixed;top:0;bottom:0;right:0;width:236px;background:var(--panel);border-left:1px solid var(--line);padding:18px 12px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .brand img{width:38px;height:38px;border-radius:10px}
  .brand b{color:var(--gold2);font-size:17px}
  .brand small{display:block;color:var(--muted);font-size:12px}
  .nav button{display:flex;width:100%;align-items:center;gap:10px;border:none;background:transparent;padding:10px 12px;margin-bottom:2px;text-align:right;color:var(--text)}
  .nav button:hover{background:var(--panel2)}
  .nav button.active{background:rgba(212,175,55,.13);color:var(--gold2)}
  .nav .badge{margin-inline-start:auto;background:var(--gold);color:#111;border-radius:99px;font-size:12px;padding:1px 8px;font-weight:700}
  .nav .badge:empty{display:none}
  .me{margin-top:18px;padding:12px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;word-break:break-all}
  main{margin-right:236px;padding:24px 28px 60px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .top h2{margin:0;font-size:22px}
  .top .grow{flex:1}
  .menu-btn{display:none}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer}
  .stat:hover{border-color:var(--gold)}
  .stat .n{font-size:28px;font-weight:700;color:var(--gold2);margin-top:6px}
  .stat .l{color:var(--muted);font-size:13px}
  .stat.alert .n{color:var(--warn)}

  .list{display:flex;flex-direction:column;gap:12px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .item .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .item .title{font-weight:600;font-size:15px}
  .item .meta{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.8}
  .item .meta b{color:var(--text);font-weight:500}
  .item .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pill{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  .pill.pending,.pill.payment_under_review,.pill.release_requested,.pill.open,.pill.new{color:var(--warn);border-color:rgba(245,165,36,.5)}
  .pill.approved,.pill.active,.pill.paid,.pill.released,.pill.deposit_held,.pill.resolved,.pill.ready{color:#7ee2a8;border-color:rgba(47,191,113,.5)}
  .pill.rejected,.pill.suspended,.pill.deleted,.pill.hidden,.pill.payment_rejected,.pill.disputed,.pill.cancelled,.pill.canceled{color:#ff9a9d;border-color:rgba(229,72,77,.5)}
  .thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--panel2);border:1px solid var(--line)}
  details{margin-top:8px}
  details summary{color:var(--muted);font-size:13px;cursor:pointer}
  pre{white-space:pre-wrap;word-break:break-all;background:#0f0f11;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;color:#c9c9cf;max-height:320px;overflow:auto;direction:ltr;text-align:left}
  .empty{color:var(--muted);text-align:center;padding:40px 10px;background:var(--panel);border:1px dashed var(--line);border-radius:16px}
  .loading{color:var(--muted);padding:30px;text-align:center}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters button.on{border-color:var(--gold);color:var(--gold2)}
  .muted{color:var(--muted)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* modal + toast */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 12px;color:var(--gold2)}
  .modal img{max-width:100%;border-radius:12px;display:block;margin:0 auto}
  .modal .actions{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
  .modal textarea,.modal input{width:100%;margin-top:6px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:10px 18px;border-radius:12px;display:none;z-index:60;max-width:90vw}
  #toast.bad{border-color:var(--bad)}

  @media (max-width:860px){
    .side{transform:translateX(100%);transition:.2s;z-index:40}
    .side.open{transform:none}
    main{margin-right:0;padding:16px}
    .menu-btn{display:inline-block}
  }
</style>
</head>
<body>

<section id="login">
  <div class="login-card">
    <img src="alami-icon.png" alt="">
    <h1>لوحة تحكم عالمي</h1>
    <p>للمدراء فقط. سجّل دخولك بحساب Google المسجّل كمدير.</p>
    <button class="btn-gold" id="googleBtn" style="width:100%;padding:12px">الدخول بحساب Google</button>
    <div class="err" id="loginErr"></div>
  </div>
</section>

<section id="app">
  <aside class="side" id="side">
    <div class="brand"><img src="alami-icon.png" alt=""><div><b>عالمي</b><small>لوحة التحكم</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="me"><div id="meEmail"></div><button class="btn-sm" id="logoutBtn" style="margin-top:10px">تسجيل الخروج</button></div>
  </aside>
  <main>
    <div class="top">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2 id="pageTitle"></h2>
      <div class="grow"></div>
      <button class="btn-sm" id="refreshBtn">↻ تحديث</button>
    </div>
    <div id="view"></div>
  </main>
</section>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, query, where, orderBy, limit, updateDoc, setDoc, serverTimestamp, getCountFromServer, deleteField, writeBatch, deleteDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

const app = initializeApp({
  apiKey: "AIzaSyDYrtyHAD2IcQLur05yUahn2mWdAi7BJvg",
  authDomain: "prob-map.firebaseapp.com",
  projectId: "prob-map",
  storageBucket: "prob-map.firebasestorage.app",
  messagingSenderId: "413532202861",
  appId: "1:413532202861:web:b9df14a1274cd401e91c64",
});
const auth = getAuth(app);
const db = getFirestore(app);
const fns = getFunctions(app, "us-central1");
const call = (name, data) => httpsCallable(fns, name)(data).then(r => r.data);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toDate = v => { if (!v) return null; if (v.toDate) return v.toDate(); if (typeof v === "object" && typeof v.seconds === "number") return new Date(v.seconds * 1000); const d = new Date(v); return isNaN(d) ? null : d; };
const fmtDate = v => { const d = toDate(v); return d && !isNaN(d) ? d.toLocaleString("ar", {dateStyle:"medium", timeStyle:"short"}) : "—"; };
const ts = v => { const d = toDate(v); return d && !isNaN(d) ? d.getTime() : 0; };
const money = n => (Number(n) || 0).toLocaleString("en", {maximumFractionDigits: 2});
const first = (o, ...keys) => { for (const k of keys) { if (o?.[k] !== undefined && o[k] !== null && o[k] !== "") return o[k]; } return ""; };
const STATUS_AR = {
  pending:"قيد المراجعة", approved:"مقبول", rejected:"مرفوض", paid:"مدفوع", cancelled:"ملغي", canceled:"ملغي",
  live:"مباشر", active:"فعّال", suspended:"موقوف", deleted:"محذوف", hidden:"مخفي", ended:"منتهي", ready:"جاهز",
  awaiting_payment:"بانتظار الدفع", payment_under_review:"الدفع قيد المراجعة", payment_rejected:"الدفع مرفوض",
  deposit_held:"العربون محجوز", release_requested:"طلب تحرير", release_approved:"تحرير مقبول", released:"محرَّر",
  disputed:"نزاع", refunded:"مسترجَع", open:"مفتوح", resolved:"تمت المعالجة", new:"جديد", request_changes:"مطلوب تعديل",
};
const pill = s => s ? `<span class="pill ${esc(s)}">${esc(STATUS_AR[s] || s)}</span>` : "";
function toast(msg, bad=false){ const t=$("#toast"); t.textContent=msg; t.className=bad?"bad":""; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", 4200); }
function errMsg(e){
  const m = e?.message || String(e);
  if (/permission|PERMISSION_DENIED|insufficient/i.test(m)) return "ما عندك صلاحية لهالعملية.";
  return m.replace(/^FirebaseError:\s*/,"");
}
function openModal(html){ $("#modal").innerHTML = html; $("#modalBg").style.display = "flex"; }
function closeModal(){ $("#modalBg").style.display = "none"; $("#modal").innerHTML = ""; }
$("#modalBg").addEventListener("click", e => { if (e.target.id === "modalBg") closeModal(); });

function ask({title, text="", input=null, okText="تأكيد", danger=false}){
  return new Promise(res => {
    openModal(`<h3>${esc(title)}</h3><div class="muted" style="line-height:1.8">${text}</div>
      ${input ? `<textarea id="askIn" rows="3" placeholder="${esc(input)}"></textarea>` : ""}
      <div class="actions"><button class="${danger?"btn-bad":"btn-gold"}" id="askOk">${esc(okText)}</button><button id="askNo">إلغاء</button></div>`);
    $("#askOk").onclick = () => { const v = input ? $("#askIn").value.trim() : true; closeModal(); res(v); };
    $("#askNo").onclick = () => { closeModal(); res(null); };
  });
}
async function act(btn, fn, okMsg){
  btn.disabled = true;
  try { await fn(); toast(okMsg || "تم ✅"); await render(); }
  catch(e){ console.error(e); toast(errMsg(e), true); btn.disabled = false; }
}
function rawDetails(d){ return `<details><summary>كل التفاصيل</summary><pre>${esc(JSON.stringify(d, (k,v)=> { if (v && typeof v === "object" && typeof v.seconds === "number" && v.nanoseconds !== undefined) { const d = toDate(v); return d ? d.toISOString() : v; } return v; }, 2))}</pre></details>`; }

const userCache = new Map();
async function userLabel(uid){
  if (!uid) return "—";
  if (!userCache.has(uid)) {
    userCache.set(uid, getDoc(doc(db, "users", uid)).then(s => s.exists() ? s.data() : null).catch(()=>null));
  }
  const u = await userCache.get(uid);
  const name = first(u, "displayName", "fullName", "name", "username") || "بدون اسم";
  const contact = first(u, "email", "phoneNumber", "phone");
  return `<b>${esc(name)}</b>${contact ? ` · ${esc(contact)}` : ""} <span class="muted" style="font-size:12px">(${esc(uid.slice(0,8))}…)</span>`;
}
async function fetchList(col, constraints=[], max=150){
  const snap = await getDocs(query(collection(db, col), ...constraints, limit(max)));
  return snap.docs.map(d => ({id: d.id, ...d.data()}));
}
async function countOf(col, ...c){ try { return (await getCountFromServer(query(collection(db, col), ...c))).data().count; } catch { return null; } }
const byNewest = (...keys) => (a,b) => ts(first(b, ...keys)) - ts(first(a, ...keys));

/* ---------- pages ---------- */
const PAGES = {
  home:        {title:"الرئيسية", icon:"📊"},
  topups:      {title:"شحن الرصيد", icon:"💰", badge:()=>countOf("wallet_top_up_requests", where("status","==","pending"))},
  deposits:    {title:"العربون", icon:"🤝", badge:()=>countOf("deposit_transactions", where("status","in",["payment_under_review","release_requested","disputed"]))},
  withdrawals: {title:"سحب أرباح البث", icon:"💸", badge:()=>countOf("live_withdrawals", where("status","in",["pending","approved"]))},
  verify:      {title:"التوثيق", icon:"🪪", badge:()=>countOf("verification_requests", where("status","==","pending"))},
  promos:      {title:"الترويج", icon:"📣", badge:()=>countOf("reel_promotions", where("status","==","pending"))},
  businesses:  {title:"المحلات والخدمات", icon:"🏪", badge:()=>countOf("businesses", where("status","==","pending"))},
  reports:     {title:"البلاغات", icon:"🚩"},
  listings:    {title:"الإعلانات", icon:"🏠"},
  reels:       {title:"الفيديوهات", icon:"🎬"},
  live:        {title:"البث المباشر", icon:"🔴"},
  sounds:      {title:"الأصوات", icon:"🎵"},
  hashtags:    {title:"الهاشتاغات", icon:"#️⃣"},
  weekly:      {title:"ترتيب الأسبوع", icon:"🏆"},
  reviews:     {title:"التقييمات", icon:"⭐"},
  pins:        {title:"تثبيت الخريطة", icon:"📍"},
  referrals:   {title:"الدعوات", icon:"🎁"},
  play:        {title:"مشتريات جوجل بلاي", icon:"🛒"},
  buses:       {title:"الباصات", icon:"🚌"},
  demo:        {title:"الإعلانات الوهمية", icon:"🧪"},
  streets:     {title:"صور الشوارع", icon:"📸", badge:()=>countOf("street_sessions", where("status","==","pending"))},
  users:       {title:"المستخدمين", icon:"👤"},
  admins:      {title:"المدراء", icon:"🔐"},
};
let current = "home";
let pageState = {};

function buildNav(){
  $("#nav").innerHTML = Object.entries(PAGES).map(([k,p]) =>
    `<button data-p="${k}" class="${k===current?"active":""}">${p.icon} ${p.title}<span class="badge" id="b-${k}"></span></button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => { go(b.dataset.p); $("#side").classList.remove("open"); });
  refreshBadges();
}
async function refreshBadges(){
  for (const [k,p] of Object.entries(PAGES)) if (p.badge) p.badge().then(n => { const el = $("#b-"+k); if (el) el.textContent = n ? n : ""; });
}
function go(p){ current = p; pageState = {}; location.hash = p; buildNav(); render(); }
async function render(){
  $("#pageTitle").textContent = PAGES[current].icon + " " + PAGES[current].title;
  $("#view").innerHTML = `<div class="loading">عم يحمّل…</div>`;
  try { await RENDER[current](); }
  catch(e){ console.error(e); $("#view").innerHTML = `<div class="empty">صار خطأ: ${esc(errMsg(e))}</div>`; }
  refreshBadges();
}
$("#refreshBtn").onclick = () => render();
$("#menuBtn").onclick = () => $("#side").classList.toggle("open");

function filterBar(options, key="filter"){
  const cur = pageState[key] ?? options[0][0];
  return `<div class="filters">${options.map(([v,l]) => `<button class="btn-sm ${v===cur?"on":""}" data-f="${esc(v)}" data-k="${key}">${esc(l)}</button>`).join("")}</div>`;
}
function bindFilters(){
  $("#view").querySelectorAll("[data-f]").forEach(b => b.onclick = () => { pageState[b.dataset.k] = b.dataset.f; render(); });
}
function emptyBox(t="ما في شي هون حالياً 👌"){ return `<div class="empty">${t}</div>`; }

const RENDER = {};

/* ---- home ---- */
RENDER.home = async () => {
  const stats = [
    ["users", "المستخدمين", countOf("users")],
    ["listings", "الإعلانات", countOf("listings")],
    ["reels", "الفيديوهات", countOf("reels")],
    ["topups", "شحن رصيد معلّق", countOf("wallet_top_up_requests", where("status","==","pending")), true],
    ["deposits", "عربون يحتاج مراجعة", countOf("deposit_transactions", where("status","in",["payment_under_review","release_requested","disputed"])), true],
    ["withdrawals", "سحوبات معلّقة", countOf("live_withdrawals", where("status","in",["pending","approved"])), true],
    ["verify", "توثيق معلّق", countOf("verification_requests", where("status","==","pending")), true],
    ["promos", "ترويج معلّق", countOf("reel_promotions", where("status","==","pending")), true],
    ["businesses", "محلات معلّقة", countOf("businesses", where("status","==","pending")), true],
    ["reports", "البلاغات", countOf("user_reports")],
  ];
  const vals = await Promise.all(stats.map(s => s[2]));
  $("#view").innerHTML = `<div class="cards">${stats.map((s,i) =>
    `<div class="stat ${s[3] && vals[i] ? "alert" : ""}" data-go="${s[0]}"><div class="l">${s[1]}</div><div class="n">${vals[i] ?? "—"}</div></div>`).join("")}</div>
    <p class="muted" style="margin-top:22px;line-height:1.9">الأرقام الصفرا يعني في طلبات ناطرة موافقتك. اضغط على أي مربع لتفتح القسم.</p>`;
  $("#view").querySelectorAll("[data-go]").forEach(el => el.onclick = () => go(el.dataset.go));
};

/* ---- wallet top-ups ---- */
RENDER.topups = async () => {
  const f = pageState.filter ?? "pending";
  const rows = (await fetchList("wallet_top_up_requests", f === "all" ? [] : [where("status","==",f)])).sort(byNewest("submittedAt","createdAt"));
  let html = filterBar([["pending","المعلّقة"],["approved","المقبولة"],["rejected","المرفوضة"],["all","الكل"]]);
  if (!rows.length) html += emptyBox();
  html += `<div class="list">${(await Promise.all(rows.map(async r => `
    <div class="item"><div class="head"><span class="title">${money(r.amount)} $</span>${pill(r.status)}<span class="muted">${esc(r.paymentMethod || "شام كاش")}</span></div>
      <div class="meta">المستخدم: ${await userLabel(r.userId)}<br>التاريخ: ${fmtDate(first(r,"submittedAt","createdAt"))}${r.rejectionReason ? `<br>سبب الرفض: ${esc(r.rejectionReason)}` : ""}</div>
      <div class="actions">
        <button class="btn-sm" data-receipt="${esc(r.id)}">🧾 عرض الإيصال</button>
        ${r.status === "pending" ? `<button class="btn-sm btn-ok" data-approve="${esc(r.id)}" data-amount="${esc(r.amount)}">✅ موافقة وإضافة الرصيد</button>
        <button class="btn-sm btn-bad" data-reject="${esc(r.id)}">❌ رفض</button>` : ""}
      </div>${rawDetails(r)}</div>`))).join("")}</div>`;
  $("#view").innerHTML = html; bindFilters();
  $("#view").querySelectorAll("[data-receipt]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { const r = await call("getWalletTopUpReceipt", {requestId: b.dataset.receipt});
      openModal(`<h3>الإيصال</h3><img src="data:${esc(r.contentType)};base64,${r.receiptBase64}"><div class="actions"><button onclick="document.getElementById('modalBg').click()">إغلاق</button></div>`);
      $("#modal .actions button").onclick = closeModal;
    } catch(e){ toast(errMsg(e), true); } b.disabled = false;

RENDER.buses = async () => {
  const city = pageState.busCity ?? "";

  const [lines, live] = await Promise.all([
    fetchList("bus_lines", cons, 300),
    fetchList("bus_live", [], 500).catch(() => []),

    <div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:12px">

  html += `<div class="list">${lines.map(l => `<div class="item"><div class="head">

      <span class="title">${esc(l.nameAr || l.name || l.id)}</span>${l.active === false ? pill("hidden") : ""}${l.adminEdited ? `<span class="muted">✏️ معدّل</span>` : ""}
      ${liveBy[l.id] ? `<span class="pill live">🚌 ${liveBy[l.id]} مباشر</span>` : ""}</div>
    <div class="meta">${esc(l.city || "—")} · ${(l.stops || []).length} موقف · كل ${esc(l.headwayMin ?? 15)} د · ${esc(l.startTime || "06:00")}–${esc(l.endTime || "22:00")} · المصدر: ${esc(l.source || "—")}</div>
    <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">
      <input data-f="nameAr" data-id="${esc(l.id)}" value="${esc(l.nameAr || l.name || "")}" placeholder="الاسم" style="min-width:180px">
      <input data-f="color" data-id="${esc(l.id)}" value="${esc(l.color || "")}" placeholder="لون (E53935)" style="width:90px">
      <input data-f="headwayMin" data-id="${esc(l.id)}" type="number" min="1" max="240" value="${esc(l.headwayMin ?? 15)}" style="width:70px" title="كل كم دقيقة">
      <input data-f="startTime" data-id="${esc(l.id)}" value="${esc(l.startTime || "06:00")}" style="width:70px" title="بداية الدوام">

    const time = s => /^\d{2}:\d{2}$/.test(s) ? s : null;

    if (!st || !en) { toast("الوقت لازم يكون متل 06:00", true); return; }
    if (color && !/^[0-9a-fA-F]{6}$/.test(color)) { toast("اللون لازم يكون 6 حروف متل E53935", true); return; }
    act(b, () => updateDoc(doc(db,"bus_lines",id), {nameAr: val(id,"nameAr"), ...(color ? {color} : {}), headwayMin: head, startTime: st, endTime: en, adminEdited: true, updatedAt: serverTimestamp()}));
  });
  $("#view").querySelectorAll("[data-bact]").forEach(b => b.onclick = () => act(b, () => updateDoc(doc(db,"bus_lines",b.dataset.bact), {active: b.dataset.on === "1", adminEdited: true, updatedAt: serverTimestamp()})));
  $("#view").querySelectorAll("[data-bdel]").forEach(b => b.onclick = async () => {
    if (!await ask({title:"حذف الخط", text:"الخط رح ينحذف نهائياً (المواقف بتضل).", danger:true, okText:"حذف"})) return;
    act(b, () => deleteDoc(doc(db,"bus_lines",b.dataset.bdel)));
  });
  $("#view").querySelectorAll("[data-bstop]").forEach(b => b.onclick = async () => {
    const id = b.dataset.bstop;
    const v = await ask({title:"إضافة موقف للخط", text:"اكتب: الاسم، خط العرض، خط الطول — مثال: البرامكة, 33.5102, 36.2913 . الموقف بينضاف بآخر الخط.", input:"الاسم, 33.51, 36.29", okText:"إضافة"});
    if (!v) return;
    const parts = v.split(/[,،]/).map(s => s.trim());
    const lat = parseFloat(parts[1]), lng = parseFloat(parts[2]);
    if (!parts[0] || !isFinite(lat) || !isFinite(lng) || lat < 32 || lat > 38 || lng < 35 || lng > 43) { toast("المعلومات مش صحيحة", true); return; }
    const sid = "adm_" + Date.now().toString(36);
    act(b, async () => {
      const batch = writeBatch(db);
      batch.set(doc(db,"bus_stops",sid), {name: parts[0], lat, lng, lineIds: [id], source: "admin", updatedAt: serverTimestamp()});
      batch.update(doc(db,"bus_lines",id), {stops: arrayUnion(sid), adminEdited: true, updatedAt: serverTimestamp()});
      await batch.commit();
    });
  });
};

/* ---- weekly ranking ---- */
function isoWeekKey(date = new Date()){
  const local = new Date(date.getTime() + 3*3600*1000);
  const d = new Date(Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate()));
  const day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return `${d.getUTCFullYear()}-W${String(Math.ceil(((d - y0)/86400000 + 1)/7)).padStart(2,"0")}`;
}
RENDER.weekly = async () => {
  const off = Number(pageState.weekOff || 0);
  const wk = isoWeekKey(new Date(Date.now() - off*7*86400000));
  const [hosts, sups] = await Promise.all([
    fetchList(`live_weekly/${wk}/hosts`, [orderBy("points","desc")], 30).catch(() => []),
    fetchList(`live_weekly/${wk}/supporters`, [orderBy("points","desc")], 30).catch(() => []),
  ]);
  const medal = i => ["🥇","🥈","🥉"][i] || `${i+1}.`;
  const board = (title, rows) => `<h3 style="margin:16px 0 8px">${title}</h3>${rows.length ? `<div class="list">${rows.map((r,i) => `<div class="item" style="padding:10px 12px"><div class="head">${r.photoUrl ? `<img class="thumb" src="${esc(r.photoUrl)}" style="border-radius:50%">` : ""}<span class="title">${medal(i)} ${esc(r.name || "—")}</span><span class="muted">💎 ${money(r.points)} نقطة · 🎁 ${money(r.gifts)} هدية</span></div><div class="meta">UID: ${esc(r.userId || r.id)}</div></div>`).join("")}</div>` : emptyBox("ما في هدايا بهالأسبوع")}`;
  $("#view").innerHTML = `<div class="row" style="margin-bottom:10px"><button class="btn-sm" id="wPrev">→ الأسبوع اللي قبل</button><b style="padding:6px 10px">${esc(wk)}${off === 0 ? " (هالأسبوع)" : ""}</b>${off > 0 ? `<button class="btn-sm" id="wNext">الأسبوع اللي بعد ←</button>` : ""}</div>
    <p class="muted" style="margin-top:0">الترتيب بيتصفّر كل اتنين الساعة 12 بالليل (توقيت إسطنبول).</p>
    ${board("🎙 أكتر المضيفين (هدايا مستلمة)", hosts)}${board("💝 أكتر الداعمين (هدايا مرسلة)", sups)}`;
  $("#wPrev").onclick = () => { pageState.weekOff = off + 1; render(); };

};

/* ---- balance tools ---- */
function editBalance(uid, current){
  openModal(`<h3>💰 تعديل الرصيد</h3>
    <div class="muted" style="line-height:1.9">الرصيد الحالي: <b style="color:var(--gold2)">${money(current)} $</b><br>التعديل ما بيبعت أي إشعار للمستخدم.</div>
    <div class="row" style="margin-top:12px">
      <select id="balMode"><option value="add">➕ إضافة مبلغ</option><option value="sub">➖ سحب مبلغ</option><option value="set">✏️ تحديد الرصيد بالضبط</option></select>
      <input id="balAmt" type="number" min="0" step="0.01" placeholder="المبلغ بالدولار" style="flex:1">
    </div>
    <input id="balNote" placeholder="ملاحظة لإلك (اختياري) — مثلاً: تعويض، تصحيح خطأ" style="margin-top:8px">
    <div class="muted" id="balPreview" style="margin-top:10px"></div>
    <div class="actions"><button class="btn-gold" id="balOk">حفظ</button><button id="balNo">إلغاء</button></div>`);
  const calc = () => { const a = Math.max(0, Number($("#balAmt").value) || 0); const m = $("#balMode").value;
    const n = m === "add" ? current + a : m === "sub" ? Math.max(0, current - a) : a; return Math.round(n * 100) / 100; };
  const upd = () => { $("#balPreview").innerHTML = `الرصيد الجديد رح يصير: <b style="color:var(--gold2)">${money(calc())} $</b>`; };
  $("#balAmt").oninput = upd; $("#balMode").onchange = upd; upd();
  $("#balNo").onclick = closeModal;
  $("#balOk").onclick = async () => {
    const a = Number($("#balAmt").value); if (!(a >= 0) || $("#balAmt").value === "") { toast("اكتب المبلغ", true); return; }
    const newBal = calc(); const b = $("#balOk"); b.disabled = true;
    try {
      const batch = writeBatch(db);
      batch.update(doc(db, "users", uid), {walletBalanceUsd: newBal, walletBalanceUpdatedAt: serverTimestamp(), updatedAt: serverTimestamp()});
      batch.set(doc(collection(db, "users", uid, "wallet_transactions")), {
        type: "admin_adjustment", mode: $("#balMode").value, amount: Math.round((newBal - current) * 100) / 100,
        balanceBefore: current, balanceAfter: newBal, currency: "USD", note: $("#balNote").value.trim(),
        approvedBy: auth.currentUser.uid, createdAt: serverTimestamp(),
      });
      await batch.commit(); closeModal(); toast(`صار الرصيد ${money(newBal)} $ ✅`); render();
    } catch(e){ console.error(e); toast(errMsg(e), true); b.disabled = false; }
  };
}

      fetchList("wallet_top_up_requests", [where("userId","==",uid)], 200).catch(() => []),
    ]);
    const TYPE = {top_up:"شحن رصيد (مقبول)", admin_adjustment:"تعديل من الأدمن", purchase:"شراء", promotion:"ترويج", gift:"هدية", deposit:"عربون", withdrawal:"سحب"};
    const rows = [
      ...tx.map(t => ({d: t.createdAt, amount: Number(t.amount) || 0, label: TYPE[t.type] || t.type || "حركة", after: t.balanceAfter, note: t.note || t.sourceRequestId || "", status: ""})),
      ...tops.filter(t => t.status !== "approved").map(t => ({d: first(t,"submittedAt","createdAt"), amount: Number(t.amount)||0, label: "طلب شحن", after: null, note: t.rejectionReason || "", status: t.status})),
    ].sort((a,b) => ts(b.d) - ts(a.d));
    $("#modal").innerHTML = `<h3>📜 سجل الرصيد</h3><div class="meta" style="margin-bottom:10px">${await userLabel(uid)}</div>
      ${rows.length ? `<div class="list">${rows.map(r => `<div class="item" style="padding:10px 12px"><div class="head"><span class="title" style="color:${r.amount < 0 ? "#ff9a9d" : "#7ee2a8"}">${r.amount > 0 ? "+" : ""}${money(r.amount)} $</span><span>${esc(r.label)}</span>${pill(r.status)}</div>
        <div class="meta">${fmtDate(r.d)}${r.after != null ? ` · الرصيد بعدها: ${money(r.after)} $` : ""}${r.note ? ` · ${esc(r.note)}` : ""}</div></div>`).join("")}</div>` : emptyBox("ما في حركات على الرصيد")}
      <div class="actions"><button id="mc">إغلاق</button></div>`;
    $("#mc").onclick = closeModal;
  } catch(e){ $("#modal").innerHTML = `<h3>📜 سجل الرصيد</h3><div class="empty">${esc(errMsg(e))}</div><div class="actions"><button id="mc">إغلاق</button></div>`; $("#mc").onclick = closeModal; }
}

/* ---- admins ---- */
RENDER.admins = async () => {
  const me = auth.currentUser;
  $("#view").innerHTML = `<div class="item"><div class="head"><span class="title">${await userLabel(me.uid)}</span>${pill("active")}<span class="pill">إنت</span></div>
    <div class="meta">${esc(me.email)} · UID: ${esc(me.uid)}</div></div>
    <p class="muted" style="line-height:1.9">🔒 للحماية: قائمة المدراء ما بتنعدل من هون أبداً، حتى لو حدا سرق جلسة الدخول ما بيقدر يضيف حاله مدير.<br>
    لإضافة مدير جديد أو شيل مدير، قول لـ Claude وهو بيعملها من Firebase مباشرة.</p>`;
};

/* ---------- auth ---------- */
$("#googleBtn").onclick = async () => {
  $("#loginErr").textContent = "";
  const provider = new GoogleAuthProvider(); provider.setCustomParameters({prompt: "select_account"});
  try { await signInWithPopup(auth, provider); }
  catch(e){
    if (["auth/popup-blocked","auth/popup-closed-by-user","auth/cancelled-popup-request","auth/web-storage-unsupported"].includes(e.code)) {
      $("#loginErr").textContent = "عم حوّلك لصفحة Google…"; return signInWithRedirect(auth, provider);
    }
    $("#loginErr").textContent = e.code === "auth/unauthorized-domain" ? "هالموقع لسا مش مسموح بـ Firebase (Authorized domains)." : errMsg(e);
  }
};
$("#logoutBtn").onclick = () => signOut(auth);
getRedirectResult(auth).catch(e => { $("#loginErr").textContent = errMsg(e); });

onAuthStateChanged(auth, async user => {
  if (!user) { $("#app").style.display = "none"; $("#login").style.display = "flex"; return; }
  let ok = false;
  try { const s = await getDoc(doc(db, "admin_users", user.uid)); ok = s.exists() && s.data().active !== false; } catch { ok = false; }
  if (!ok) {
    $("#loginErr").innerHTML = `الحساب <b>${esc(user.email)}</b> مش مدير.`;
    await signOut(auth); return;
  }
  $("#login").style.display = "none"; $("#app").style.display = "block";
  $("#meEmail").textContent = user.email;
  const h = location.hash.replace("#",""); current = PAGES[h] ? h : "home";
  buildNav(); render();
});
</script>
